name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code -- lib
      - run: pnpm selfcheck

  install:
    runs-on: ubuntu-latest
    env:
      DSH: /tmp/dsh-cli/node_modules/.bin/dsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: mkdir -p /tmp/dsh-cli && cd /tmp/dsh-cli && pnpm init -y > /dev/null && pnpm add @deepseek-ai/dsh@0.2.0-rc.1 --allow-build @deepseek-ai/dsh-subprocess-local --allow-build @google/genai --allow-build koffi --allow-build node-pty --allow-build protobufjs
      - run: $DSH plugin --profile ci-compact-fix add .
      - run: $DSH --profile ci-compact-fix --dump-config | grep compact-fix
      - run: pnpm pack --pack-destination /tmp/compact-fix-pkg
      - run: $DSH plugin --profile ci-compact-fix-pack add /tmp/compact-fix-pkg/*.tgz
      - run: $DSH --profile ci-compact-fix-pack --dump-config | grep compact-fix
